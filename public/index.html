<script>
  let loggedInEmpId = '';
  let cachedPartDayData = null;
  const API_BASE_URL = window.location.origin;

  // Web Push Registration Helper
  async function registerPushNotifications() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

    try {
      const reg = await navigator.serviceWorker.register('/sw.js');
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return;

      const res = await fetch(`${API_BASE_URL}/api/push/vapid-public-key`);
      const { publicKey } = await res.json();
      if (!publicKey) return;

      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });

      await fetch(`${API_BASE_URL}/api/push/subscribe`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(subscription)
      });
    } catch (err) {
      console.warn('Push registration skipped or failed:', err);
    }
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  // Handle Login
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    loggedInEmpId = document.getElementById('employeeIdInput').value.trim();
    if (loggedInEmpId) {
      document.getElementById('loggedEmpId').innerText = loggedInEmpId;
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      updateDateTime();
      
      updateSectionsOnly('rptYearSelect', 'rptSection');
      updateSectionsOnly('stuYearSelect', 'stuSection');
      updateSectionsOnly('absYearSelect', 'absSection');
      updateSectionsOnly('partYearSelect', 'partSection');

      loadDashboardSummary();
      loadMissingAttendanceDashboard();

      // Register Browser Push
      registerPushNotifications();
    }
  });

  function logout() {
    loggedInEmpId = '';
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('appSection').classList.add('hidden');
  }

  function updateDateTime() {
    document.getElementById('autoDateTime').value = new Date().toLocaleString();
  }

  function updateOptions(yearElemId, secElemId, periodContainerId) {
    const year = document.getElementById(yearElemId).value;
    const sectionSelect = document.getElementById(secElemId);
    const periodContainer = document.getElementById(periodContainerId);

    sectionSelect.innerHTML = '';
    periodContainer.innerHTML = '';

    let morningPeriods = [];
    let afternoonPeriods = [];

    if (year === 'III') {
      ['A','B','C','D','E','F','G','H'].forEach(sec => {
        sectionSelect.innerHTML += `<option value="${sec}">${sec}</option>`;
      });
      morningPeriods = [1, 2, 3, 4];
      afternoonPeriods = [5, 6, 7];
    } else if (year === 'IV') {
      ['A','B','C','D','E','F'].forEach(sec => {
        sectionSelect.innerHTML += `<option value="${sec}">${sec}</option>`;
      });
      morningPeriods = [1, 2, 3];
      afternoonPeriods = [4, 5, 6, 7];
    } else {
      periodContainer.innerHTML = '<div style="color: #888; font-size: 13px;">Please select Year first to load periods.</div>';
      return;
    }

    morningPeriods.forEach(p => {
      periodContainer.innerHTML += `
        <label class="checkbox-item">
          <input type="checkbox" name="periodSelect" value="${p}" data-session="Morning">
          Period ${p} (Morning Session)
        </label>`;
    });

    afternoonPeriods.forEach(p => {
      periodContainer.innerHTML += `
        <label class="checkbox-item">
          <input type="checkbox" name="periodSelect" value="${p}" data-session="Afternoon">
          Period ${p} (Afternoon Session)
        </label>`;
    });
  }

  function updateSectionsOnly(yearElemId, secElemId) {
    const year = document.getElementById(yearElemId).value;
    const sectionSelect = document.getElementById(secElemId);
    sectionSelect.innerHTML = '';

    const sections = (year === 'III') ? ['A','B','C','D','E','F','G','H'] : ['A','B','C','D','E','F'];
    sections.forEach(sec => {
      sectionSelect.innerHTML += `<option value="${sec}">${sec}</option>`;
    });
  }

  async function loadDashboardSummary() {
    const container = document.getElementById('dashboardSummaryContent');
    const countBadge = document.getElementById('totalFlaggedCount');

    try {
      const res = await fetch(`${API_BASE_URL}/api/dashboard/frequent-afternoon-absentees`);
      const data = await res.json();

      if (!res.ok || data.error) {
        container.innerHTML = '<div style="color:#721c24;">Failed to load dashboard summary.</div>';
        countBadge.innerText = '0';
        return;
      }

      countBadge.innerText = `${data.totalCount} Student(s)`;

      if (data.totalCount === 0) {
        container.innerHTML = '<div style="color:#27ae60; font-weight:bold; font-size:14px;">✓ No students have reached 6 or more afternoon absentee sessions across any section!</div>';
        return;
      }

      let html = '';
      Object.keys(data.groupedData).forEach(classGroup => {
        html += `
          <div style="margin-top:10px;">
            <strong style="color:#2c3e50; font-size:14px;">📍 ${classGroup} (${data.groupedData[classGroup].length} Students):</strong>
            <div class="table-responsive" style="margin-top:6px; margin-bottom:12px;">
              <table>
                <thead>
                  <tr>
                    <th>Roll Number</th>
                    <th>Flagged Sessions (Morning Present & Afternoon Absent)</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>`;

        data.groupedData[classGroup].forEach(student => {
          html += `
            <tr>
              <td><strong>${student.rollNumber}</strong></td>
              <td><span style="color:#c53030; font-weight:bold;">${student.flaggedSessionsCount} Sessions</span></td>
              <td><span style="background:#fff5f5; color:#c53030; padding:2px 8px; border-radius:4px; font-weight:600; font-size:12px;">Action Required</span></td>
            </tr>`;
        });

        html += '</tbody></table></div></div>';
      });

      container.innerHTML = html;

    } catch (err) {
      container.innerHTML = `<div style="color:#721c24;">Error connecting to backend: ${err.message}</div>`;
      countBadge.innerText = 'Error';
    }
  }

  async function loadMissingAttendanceDashboard() {
    const c = document.getElementById("missingAttendanceContent");
    const b = document.getElementById("missingAttendanceCount");
    const today = new Date().toISOString().split("T")[0];
    const classes = [...["A","B","C","D","E","F","G","H"].map(s => ({year:"III", section:s})), ...["A","B","C","D","E","F"].map(s => ({year:"IV", section:s}))];
    let rows = "", count = 0;

    for (const cls of classes) {
      try {
        const r = await fetch(`${API_BASE_URL}/api/reports/missing-periods?year=${cls.year}&section=${cls.section}&date=${today}`);
        const d = await r.json();
        if (d.missingPeriods && d.missingPeriods.length) {
          count++;
          rows += `<tr><td>${cls.year}</td><td>${cls.section}</td><td>${d.missingPeriods.join(", ")}</td></tr>`;
        }
      } catch(e) {}
    }
    b.textContent = count;
    c.innerHTML = count ? `<div class="table-responsive"><table><thead><tr><th>Year</th><th>Section</th><th>Missing Periods</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="success">✓ Attendance has been posted for all sections today.</div>`;
  }

  document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusDiv = document.getElementById('entryStatus');
    statusDiv.innerHTML = '';

    const year = document.getElementById('yearSelect').value;
    const section = document.getElementById('sectionSelect').value;
    const checkedBoxes = Array.from(document.querySelectorAll('input[name="periodSelect"]:checked'));

    if (checkedBoxes.length === 0) {
      alert("⚠️ Please select at least one period before submitting.");
      return;
    }

    const todayDate = new Date().toISOString().split('T')[0];
    statusDiv.innerHTML = '<div style="color: #666; margin-top: 10px;">Checking existing records...</div>';

    try {
      const checkRes = await fetch(`${API_BASE_URL}/api/reports/daily?year=${year}&section=${section}&date=${todayDate}`);
      const existingRecords = await checkRes.json();
      const selectedPeriods = checkedBoxes.map(cb => Number(cb.value));

      const alreadyPostedPeriods = [];
      if (Array.isArray(existingRecords)) {
        existingRecords.forEach(record => {
          if (selectedPeriods.includes(Number(record.period))) {
            alreadyPostedPeriods.push(record.period);
          }
        });
      }

      if (alreadyPostedPeriods.length > 0) {
        alert(`⚠️ Attendance for Year ${year}, Section ${section}, Period(s) [${alreadyPostedPeriods.join(', ')}] has ALREADY been posted today!`);
        statusDiv.innerHTML = `<div class="alert">Submission Blocked: Period(s) ${alreadyPostedPeriods.join(', ')} were already recorded today.</div>`;
        return;
      }

      statusDiv.innerHTML = '<div style="color: #666; margin-top: 10px;">Submitting attendance...</div>';

      let successCount = 0;
      for (const cb of checkedBoxes) {
        const payload = {
          employeeId: loggedInEmpId,
          facultyName: document.getElementById('facultyName').value,
          subjectName: document.getElementById('subjectName').value,
          year: year,
          section: section,
          period: Number(cb.value),
          sessionType: cb.getAttribute('data-session'),
          absentRollNumbers: document.getElementById('absentRolls').value
        };

        const res = await fetch(`${API_BASE_URL}/api/attendance`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) successCount++;
      }

      if (successCount === checkedBoxes.length) {
        statusDiv.innerHTML = `<div class="success">Attendance recorded successfully for ${successCount} period(s) in MongoDB!</div>`;
        document.getElementById('absentRolls').value = '';
        checkedBoxes.forEach(cb => cb.checked = false);
        loadDashboardSummary();
        loadMissingAttendanceDashboard();
      } else {
        statusDiv.innerHTML = `<div class="alert">Warning: Processed ${successCount} out of ${checkedBoxes.length} periods.</div>`;
      }

    } catch (err) {
      statusDiv.innerHTML = `<div class="alert">Network error: ${err.message}</div>`;
    }
  });

  function showTab(tabName) {
    ['entry', 'class', 'student', 'absentees', 'partDay'].forEach(t => {
      document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('hidden');
      document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.remove('active');
    });
    document.getElementById('view' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.remove('hidden');
    document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.active = true;
    document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
  }

  async function fetchClassReport() {
    const yr = document.getElementById('rptYearSelect').value;
    const sec = document.getElementById('rptSection').value;
    const dt = document.getElementById('rptDate').value;

    if (!sec || !dt) {
      alert("Please select Section and Date.");
      return;
    }

    try {
      const res = await fetch(`${API_BASE_URL}/api/reports/daily?year=${yr}&section=${sec}&date=${dt}`);
      const records = await res.json();

      if (!records || records.length === 0) {
        document.getElementById('classReportResults').innerHTML = '<div class="alert">No attendance records found for the selected criteria.</div>';
        return;
      }

      let html = `
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Period</th>
                <th>Session</th>
                <th>Subject</th>
                <th>Employee ID</th>
                <th>Faculty Name</th>
                <th>Absent Roll Numbers</th>
              </tr>
            </thead>
            <tbody>`;

      records.forEach(r => {
        const absentees = r.absentRollNumbers && r.absentRollNumbers.length > 0 
          ? r.absentRollNumbers.join(', ') 
          : '<span style="color: green; font-weight: bold;">Nil</span>';

        html += `
          <tr>
            <td><strong>Period ${r.period}</strong></td>
            <td>${r.sessionType || 'N/A'}</td>
            <td>${r.subjectName || 'N/A'}</td>
            <td><code>${r.employeeId || 'N/A'}</code></td>
            <td>${r.facultyName || 'N/A'}</td>
            <td>${absentees}</td>
          </tr>`;
      });

      html += '</tbody></table></div>';
      document.getElementById('classReportResults').innerHTML = html;

    } catch (err) {
      document.getElementById('classReportResults').innerHTML = `<div class="alert">Error loading report: ${err.message}</div>`;
    }
  }

  async function fetchStudentReport() {
    const yr = document.getElementById('stuYearSelect').value;
    const sec = document.getElementById('stuSection').value;
    const roll = document.getElementById('stuRollNumber').value.trim();

    if (!roll) {
      alert("Please enter Roll Number.");
      return;
    }

    const resultsDiv = document.getElementById('studentReportResults');
    resultsDiv.innerHTML = '<div style="color: #666; margin-top: 10px;">Searching student records...</div>';

    try {
      const res = await fetch(`${API_BASE_URL}/api/reports/student?year=${yr}&section=${sec}&rollNumber=${roll}`);
      const data = await res.json();

      if (!res.ok || data.error) {
        resultsDiv.innerHTML = `<div class="alert">⚠️ ${data.error || 'No records found for the specified Roll Number in this Year & Section combination.'}</div>`;
        return;
      }

      let html = `
        <div style="margin-top:15px; background:#f8f9fa; padding:15px; border-radius:6px; border:1px solid #e2e8f0;">
          <p style="margin: 5px 0;"><strong>Roll Number:</strong> ${data.rollNumber}</p>
          <p style="margin: 5px 0;"><strong>Class / Section:</strong> ${data.year} Year - Section ${data.section}</p>
          <p style="margin: 5px 0;"><strong>Total Recorded Days (Sessions):</strong> ${data.totalSessions}</p>
          <p style="margin: 5px 0;"><strong>Present Days:</strong> ${data.totalPresentSessions} (${data.presentPercentage})</p>
          <p style="margin: 5px 0; color: #c53030;"><strong>Absent Days (Sessions):</strong> ${data.totalAbsentSessions} (${data.absentPercentage})</p>
        </div>

        <h4 style="margin-top: 20px; color: #2c3e50;">Absent Breakdown by Date</h4>`;

      if (!data.absentBreakdown || data.absentBreakdown.length === 0) {
        html += `<div class="success">No absences recorded for Roll Number ${data.rollNumber}! 100% Attendance recorded.</div>`;
      } else {
        html += `
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Absent Periods (Ascending)</th>
                  <th>Total Periods Missed</th>
                  <th>Session Contribution</th>
                </tr>
              </thead>
              <tbody>`;

        data.absentBreakdown.forEach(item => {
          const formattedPeriods = item.periods.map(p => `Period ${p}`).join(', ');

          html += `
            <tr>
              <td><strong>${item.date}</strong></td>
              <td><span style="color:#e53e3e; font-weight:600;">${formattedPeriods}</span></td>
              <td>${item.periodCount} Period(s)</td>
              <td><strong>1 Session</strong></td>
            </tr>`;
        });

        html += '</tbody></table></div>';
      }

      resultsDiv.innerHTML = html;

    } catch (err) {
      resultsDiv.innerHTML = `<div class="alert">Network Error: ${err.message}</div>`;
    }
  }

  async function fetchFrequentAbsentees() {
    const yr = document.getElementById('absYearSelect').value;
    const sec = document.getElementById('absSection').value;

    try {
      const res = await fetch(`${API_BASE_URL}/api/reports/frequent-absentees?year=${yr}&section=${sec}`);
      const list = await res.json();

      let html = `
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Roll Number</th>
                <th>Status Flag</th>
              </tr>
            </thead>
            <tbody>`;

      (list || []).forEach(item => {
        html += `<tr><td><strong>${item.rollNumber}</strong></td><td style="color:red;">${item.reason}</td></tr>`;
      });

      html += '</tbody></table></div>';
      document.getElementById('absenteesResults').innerHTML = (list && list.length) ? html : '<div class="success">No frequent absentees found!</div>';
    } catch (err) {
      document.getElementById('absenteesResults').innerHTML = `<div class="alert">Error loading report: ${err.message}</div>`;
    }
  }

  async function fetchPartDayReport() {
    const yr = document.getElementById('partYearSelect').value;
    const sec = document.getElementById('partSection').value;
    const dt = document.getElementById('partDate').value;
    const pdfBtn = document.getElementById('btnDownloadPDF');

    if (!sec || !dt) {
      alert("Please select Section and Date.");
      return;
    }

    const resultsDiv = document.getElementById('partDayResults');
    resultsDiv.innerHTML = '<div style="color: #666; margin-top: 10px;">Analyzing attendance records...</div>';
    pdfBtn.classList.add('hidden');
    cachedPartDayData = null;

    try {
      const res = await fetch(`${API_BASE_URL}/api/reports/morning-present-afternoon-absent?year=${yr}&section=${sec}&date=${dt}`);
      const data = await res.json();

      if (!res.ok) {
        resultsDiv.innerHTML = `<div class="alert">⚠️ ${data.error || 'Failed to fetch report.'}</div>`;
        return;
      }

      if (data.message) {
        resultsDiv.innerHTML = `<div class="alert">${data.message}</div>`;
        return;
      }

      if (!data.students || data.students.length === 0) {
        resultsDiv.innerHTML = '<div class="success">No students found who were present in the morning but absent in the afternoon on this date!</div>';
        return;
      }

      cachedPartDayData = { year: yr, section: sec, date: dt, students: data.students };

      let html = `
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Roll Number</th>
                <th>Morning Status</th>
                <th>Afternoon Missed Periods</th>
              </tr>
            </thead>
            <tbody>`;

      data.students.forEach(item => {
        const formattedPeriods = item.missedAfternoonPeriods.map(p => `Period ${p}`).join(', ');

        html += `
          <tr>
            <td><strong>${item.rollNumber}</strong></td>
            <td><span style="color: green; font-weight: bold;">Present (0 Absences)</span></td>
            <td><span style="color: #c53030; font-weight: bold;">${formattedPeriods}</span></td>
          </tr>`;
      });

      html += '</tbody></table></div>';
      resultsDiv.innerHTML = html;
      pdfBtn.classList.remove('hidden');

    } catch (err) {
      resultsDiv.innerHTML = `<div class="alert">Error loading report: ${err.message}</div>`;
    }
  }

  function downloadPartDayPDF() {
    if (!cachedPartDayData || !cachedPartDayData.students || cachedPartDayData.students.length === 0) {
      alert("No data available to download. Please generate the report first.");
      return;
    }

    const deptName = "DEPARTMENT OF CSE-AIML";
    const { year, section, date, students } = cachedPartDayData;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });

    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 14;

    const tableBody = students.map((stu, index) => [
      index + 1,
      stu.rollNumber,
      'Present',
      stu.missedAfternoonPeriods.map(p => `Period ${p}`).join(', ')
    ]);

    doc.autoTable({
      startY: 40,
      head: [['S.No', 'Roll Number', 'Morning Status', 'Missed Afternoon Periods']],
      body: tableBody,
      theme: 'grid',
      margin: { top: 40, bottom: 35, left: margin, right: margin },
      headStyles: { fillColor: [52, 152, 219], textColor: 255, fontStyle: 'bold', halign: 'center' },
      columnStyles: {
        0: { halign: 'center', cellWidth: 15 },
        1: { halign: 'center', cellWidth: 45 },
        2: { halign: 'center', cellWidth: 40 },
        3: { halign: 'left' }
      },
      styles: { fontSize: 9, cellPadding: 3, overflow: 'linebreak' },
      didDrawPage: function (data) {
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.setTextColor(30);
        doc.text(deptName.toUpperCase(), pageWidth / 2, 15, { align: "center" });

        doc.setFontSize(10);
        doc.text("MORNING PRESENT & AFTERNOON ABSENTEE REPORT", pageWidth / 2, 22, { align: "center" });

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.text(`Year / Section: ${year} Year - Section ${section}`, margin, 31);
        doc.text(`Date: ${date}`, pageWidth - margin, 31, { align: "right" });

        doc.setDrawColor(180);
        doc.setLineWidth(0.4);
        doc.line(margin, 34, pageWidth - margin, 34);

        doc.setFontSize(8);
        doc.setTextColor(120);
        doc.text(`Page ${data.pageNumber}`, pageWidth / 2, pageHeight - 8, { align: "center" });
      }
    });

    let finalY = doc.lastAutoTable.finalY + 25;
    if (finalY > pageHeight - 25) {
      doc.addPage();
      finalY = 45;
    }

    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(0);

    doc.line(margin, finalY, margin + 55, finalY);
    doc.text("Coordinator Signature", margin, finalY + 5);

    doc.line(pageWidth - margin - 55, finalY, pageWidth - margin, finalY);
    doc.text("Head of the Department", pageWidth - margin, finalY + 5, { align: "right" });

    doc.save(`Afternoon_Absentees_${year}Yr_Sec${section}_${date}.pdf`);
  }
</script>
